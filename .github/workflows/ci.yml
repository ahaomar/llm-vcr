name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite (record/replay/drift, no API key)
        run: node test/run-tests.js
      - name: Verify shipped cassettes replay cleanly
        run: node scripts/record-demo-cassettes.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llm-vcr .
      - name: Smoke test replay mode in container
        run: |
          docker run -d --name vcr -p 9090:9090 -e VCR_MODE=replay llm-vcr
          sleep 3
          curl -sf http://localhost:9090/__vcr/health
          curl -sf -X POST http://localhost:9090/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hello in one short sentence."}]}' | grep -o 'replayed\|Hello' || true
